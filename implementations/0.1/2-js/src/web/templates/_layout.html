<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{% block title %}Pinpoint{% endblock %}</title>
  <link rel="stylesheet" href="/static/style.css">
</head>
<body>
  <div class="shell">
    <aside class="sidebar">
      <div class="sidebar-brand">
        <h1>Pinpoint</h1>
        <div class="tagline">tag it. forget it.</div>
      </div>
      <nav>
        <a href="/" class="nav-item {% if active == 'home' %}active{% endif %}">
          <span class="icon">⌂</span> Home
        </a>
        <a href="/queue" class="nav-item {% if active == 'queue' %}active{% endif %}">
          <span class="icon">◉</span> Queue
          {% if pendingCount > 0 %}
            <span class="nav-badge">{{ pendingCount }}</span>
          {% endif %}
        </a>
        <a href="/library" class="nav-item {% if active == 'library' %}active{% endif %}">
          <span class="icon">▦</span> Library
        </a>
      </nav>
      <div class="sidebar-footer">
        {% block sidebar_footer %}{% endblock %}
      </div>
    </aside>

    <main class="main">
      {% block content %}{% endblock %}
    </main>
  </div>

  {% block scripts %}{% endblock %}
</body>
</html>
