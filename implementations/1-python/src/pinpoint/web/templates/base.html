<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{% block title %}Pinpoint{% endblock %}</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@picocss/pico@2/css/pico.min.css">
    <script src="https://unpkg.com/htmx.org@2.0.4"></script>
    <link rel="stylesheet" href="/static/style.css">
</head>
<body>
    <nav class="container-fluid">
        <ul>
            <li><a href="/" style="text-decoration:none"><strong>&#9673; Pinpoint</strong></a></li>
        </ul>
        <ul>
            <li><a href="/" {% if request.url.path == "/" %}aria-current="page"{% endif %}>
                Queue
                {% if remaining is defined and remaining > 0 %}
                    <span class="badge">{{ remaining }}</span>
                {% endif %}
            </a></li>
            <li><a href="/library" {% if request.url.path == "/library" %}aria-current="page"{% endif %}>Library</a></li>
        </ul>
    </nav>
    <main class="container">
        {% block content %}{% endblock %}
    </main>
</body>
</html>
