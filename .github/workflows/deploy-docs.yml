name: Deploy docs

on:
  push:
    branches: [main]
    paths: ['docs/**', 'SPEC.md', '.github/workflows/deploy-docs.yml']
  workflow_dispatch:

permissions:
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      # The sidebar's Requirements entry resolves to docs/spec.md; SPEC.md stays
      # at the repo root, where the spec-driven skills look for it.
      - name: Copy SPEC into docs
        run: cp SPEC.md docs/spec.md
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: docs
      - id: deployment
        uses: actions/deploy-pages@v4
