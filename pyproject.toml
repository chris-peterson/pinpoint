[project]
name = "pinpoint"
version = "0.2.0"
description = "Pinpoint v0.2 — hybrid implementation (Python API + JS SPA)"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.34",
    "aiosqlite>=0.20",
    "pyyaml>=6",
    "watchfiles>=1.0",
    "mutagen>=1.47",
    "python-multipart>=0.0.18",
    "pillow>=10.0",
    "imagehash>=4.3",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.24",
    "httpx>=0.28",
    "ruff>=0.8",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/pinpoint"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.pytest.ini_options]
asyncio_mode = "auto"
